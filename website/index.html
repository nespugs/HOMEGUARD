<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HOMEGUARD | Smart Safety Dashboard</title>
<style>
:root{--bg:#f5f7fb;--surface:#fff;--blue:#2563eb;--bluebg:#eaf2ff;--ink:#172b4d;--muted:#718096;--border:#e6ebf2;--green:#059669;--red:#dc2626;--amber:#d97706;--shadow:0 4px 20px #21365b08}*{box-sizing:border-box}body{margin:0;font:14px/1.5 Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--ink)}button,input,select{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.5}.shell{display:flex;min-height:100vh}.sidebar{width:242px;flex-shrink:0;background:#fff;border-right:1px solid var(--border);padding:26px 15px;display:flex;flex-direction:column;gap:26px;position:sticky;top:0;height:100vh}.brand{display:flex;align-items:center;gap:11px;padding:0 10px}.logo{width:42px;height:42px;display:grid;place-items:center;background:var(--blue);color:white;border-radius:12px;font-size:23px}.brand strong{font-size:18px;letter-spacing:.5px}.brand small{display:block;font-size:10px;color:#94a3b8;letter-spacing:1.5px}.side-label{font-size:10px;font-weight:700;letter-spacing:1.7px;color:#9aa7b7;padding:0 14px}.nav{display:flex;flex-direction:column;gap:5px}.nav button{border:0;background:transparent;color:#627086;text-align:left;border-radius:10px;padding:12px 14px;display:flex;gap:12px;align-items:center}.nav button.active{background:var(--bluebg);color:var(--blue);font-weight:700}.nav button:hover{background:#f0f5fc}.sidebar-foot{margin-top:auto;background:#f2f6fb;padding:14px;border-radius:12px;color:#63758c;font-size:12px}.main{min-width:0;flex:1;padding:30px clamp(18px,3vw,48px);max-width:1700px;margin:auto;width:100%}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:24px}.crumb{font-size:11px;letter-spacing:1px;color:#97a3b4}.top h1{margin:4px 0 0;font-size:28px}.pill{display:inline-flex;align-items:center;gap:6px;background:#edf2f8;border-radius:999px;color:#60738a;padding:6px 11px;font-size:12px;font-weight:600}.pill.ok{background:#e5f8ef;color:#047857}.pill.warn{background:#fff3e4;color:#a16207}.pill.danger{background:#feecec;color:#b91c1c}.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);padding:21px}.card h2{font-size:16px;margin:0 0 13px}.muted{color:var(--muted)}.tiny{font-size:12px}.mode-card{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:20px}.mode-card h2{margin:3px 0 0}.mode-buttons{display:flex;background:#f1f5f9;border-radius:11px;padding:4px;gap:4px}.mode-buttons button{border:0;background:transparent;border-radius:8px;padding:10px 16px;font-weight:700;color:#7a899b}.mode-buttons button.active{background:var(--blue);color:white;box-shadow:0 3px 10px #2563eb30}.sensors{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:20px}.sensor{cursor:pointer;transition:transform .15s,border-color .15s}.sensor:hover{transform:translateY(-2px);border-color:#a8c5fb}.sensor.selected{border-color:#93b8ff}.sensor-top{display:flex;align-items:center;justify-content:space-between}.sensor-icon{font-size:21px;display:grid;place-items:center;width:43px;height:43px;border-radius:11px;background:#f0f5fb}.sensor-name{color:#718096;margin-top:16px}.sensor-value{font-size:30px;font-weight:750;letter-spacing:-1px;margin:5px 0}.sensor-value span{font-size:14px;font-weight:500;color:#8b9aaa}.row2{display:grid;grid-template-columns:1.65fr 1fr;gap:20px;margin-bottom:20px}.chart-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.tabs{display:flex;gap:7px;flex-wrap:wrap}.btn{background:#fff;border:1px solid #dce4ee;color:#5c6f86;border-radius:9px;padding:8px 12px;font-weight:650}.btn.active,.btn.primary{background:var(--blue);border-color:var(--blue);color:white}.btn:hover:not(:disabled){filter:brightness(.97)}.chart-wrap{height:240px;margin-top:16px;position:relative}.chart-wrap svg{width:100%;height:100%}.chart-labels{display:flex;justify-content:space-between;color:#9aa6b6;font-size:11px}.devices{display:flex;flex-direction:column;gap:13px}.device{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid #edf1f6}.device:last-child{border-bottom:0}.device strong{font-weight:600}.device-name{display:flex;gap:12px;align-items:center}.device-icon{font-size:22px}.recommend{background:#f6f9ff;border-radius:10px;padding:15px;color:#526680;margin-top:12px}.table-scroll{overflow:auto}table{width:100%;border-collapse:collapse;text-align:left;white-space:nowrap}th,td{padding:13px 12px;border-bottom:1px solid #edf1f6}th{font-size:12px;color:#8795a8;font-weight:650}td{font-size:13px}.table-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:8px}.table-head h2{margin:0}.stack{display:grid;gap:20px}.control-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px;border-radius:11px;background:#f7f9fc;margin:10px 0}.notice{padding:13px 15px;background:#eff6ff;border:1px solid #dbeafe;border-radius:10px;color:#355b91;margin-bottom:18px}.status-hero{text-align:center;background:#f3f7fd;border-radius:14px;padding:28px;margin:15px 0}.status-hero .symbol{font-size:34px}.status-hero h2{margin:6px 0}.two-buttons{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}.empty{color:#94a3b8;text-align:center;padding:26px}.field{display:grid;gap:6px;margin:12px 0}.field input{width:100%;max-width:380px;padding:11px;border:1px solid #dce4ee;border-radius:9px}.footer{font-size:11px;color:#9aa7b7;display:flex;justify-content:space-between;margin-top:24px}.hidden{display:none!important}@media(max-width:1120px){.sensors{grid-template-columns:repeat(2,1fr)}.row2{grid-template-columns:1fr}}@media(max-width:750px){.shell{display:block}.sidebar{position:static;width:100%;height:auto;padding:12px;gap:10px}.brand{padding:0}.side-label,.sidebar-foot{display:none}.nav{flex-direction:row;overflow-x:auto}.nav button{white-space:nowrap;padding:9px}.main{padding:18px}.mode-card{display:block}.mode-buttons{margin-top:14px;overflow:auto}.sensors{gap:10px}.card{padding:15px}.top h1{font-size:23px}.sensor-value{font-size:25px}}@media(max-width:410px){.sensors{grid-template-columns:1fr}.mode-buttons button{padding:9px 10px}}
.active-alerts{margin-bottom:20px}.alert-grid{display:grid;gap:10px}.alert-item{border:1px solid #fed7aa;background:#fff7ed;border-radius:11px;padding:13px 15px;display:flex;gap:12px;align-items:flex-start}.alert-item.critical{border-color:#fecaca;background:#fef2f2}.alert-item.clear{border-color:#bbf7d0;background:#f0fdf4}.alert-item strong{display:block}.alert-item p{margin:3px 0 0;color:#64748b;font-size:12px}.alert-meta{font-size:12px;color:#718096;margin-bottom:12px}.alert-item .alert-symbol{font-size:21px} </style>
</head>
<body>
<div class="shell"><aside class="sidebar"><div class="brand"><div class="logo">⬡</div><div><strong>HOMEGUARD</strong><small>SMART SAFETY</small></div></div><div><div class="side-label">WORKSPACE</div><nav class="nav" id="nav"></nav></div><div class="sidebar-foot">◉ <b id="sideStatus">Demo preview</b><br><span id="sideSub">Hardware not connected</span></div></aside><main class="main"><header class="top"><div><div class="crumb" id="breadcrumb">HOME / DASHBOARD</div><h1 id="pageTitle">Dashboard</h1></div><span class="pill" id="connectionBadge">◉ Demo Preview</span></header><section class="card mode-card"><div><div class="tiny muted">SYSTEM OPERATING MODE</div><h2 id="modeLabel">AUTO</h2></div><div class="mode-buttons" id="modeButtons"><button data-mode="AUTO" class="active">AUTO</button><button data-mode="MAINTENANCE">MAINTENANCE</button><button data-mode="SLEEP">SLEEP</button></div></section><div id="content"></div><footer class="footer"><span>HOMEGUARD • CLEAN LIGHT INTERFACE</span><span id="footerMode">Demo mode • v1.0</span></footer></main></div>
<script>
'use strict';
// This website supports live readings and saved SQLite logs via FastAPI GET /api/logs.
// Hardware commands are intentionally disabled until real, authenticated command endpoints exist.
const API_BASE=location.protocol==='file:'?'http://127.0.0.1:8000':location.origin;
const sensors=[{key:'temperature',name:'Temperature',unit:'°C',icon:'🌡️',color:'#f59e0b'},{key:'humidity',name:'Humidity',unit:'%',icon:'💧',color:'#3b82f6'},{key:'gas',name:'Gas Level',unit:'raw',icon:'〰️',color:'#8b5cf6'},{key:'distance',name:'Distance',unit:'cm',icon:'📏',color:'#0d9488'}];
const nav=[['Dashboard','▦'],['Sensor Logs','▤'],['Alert History','♧'],['Device Status','⚙'],['Sleep History','☾'],['Cloud Sync','☁'],['Settings','⚑']];
const demo={temperature:32.5,humidity:70.2,gas:150,distance:25.5,led:false,fan:false,buzzer:false,mode:'AUTO',last_update:null};
const state={page:'Dashboard',mode:'AUTO',metric:'temperature',reading:{...demo},connected:false,history:[],logs:[],logsLoaded:false,alerts:[],alertsLoaded:false,alertsError:false,alertSettings:null,alertSettingsError:'',alertSettingsBusy:false,alertSettingsNotice:'',sleepLogs:[],sleepLogsLoaded:false,sleepLogsError:false,deviceLogs:[],deviceLogsLoaded:false,deviceLogsError:false,demoSleep:false,simOutputs:{led:false,fan:false,buzzer:false},logMinutes:3,lastLoggedAt:null,notice:'',outputs:{led:false,fan:false,buzzer:false},outputsLoaded:false,hardwareConnected:false,hardwareAcknowledged:false,outputBusy:false,alertLatch:{gas:false,humidity:false},lastSensorAt:null,syncCounts:null,syncHealth:null,syncError:false,syncUpdatedAt:null};
const $=id=>document.getElementById(id);
const safe=s=>String(s??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=(n,d=1)=>n!==null&&n!==undefined&&n!==''&&Number.isFinite(Number(n))?Number(n).toFixed(d):'—';
const time=t=>t?new Date(t).toLocaleString():'—';
const badge=(label,cls='')=>`<span class="pill ${cls}">${safe(label)}</span>`;
function renderNav(){ $('nav').innerHTML=nav.map(([name,ico])=>`<button data-page="${name}" class="${state.page===name?'active':''}"><span>${ico}</span>${name}</button>`).join(''); }
function card(title,body,extra=''){return `<section class="card ${extra}"><h2>${title}</h2>${body}</section>`}
function render(){renderNav();$('pageTitle').textContent=state.page;$('breadcrumb').textContent='HOME / '+state.page.toUpperCase();$('modeLabel').textContent=state.mode;$('connectionBadge').textContent=state.connected?'● Backend Connected':'◉ API Unavailable';$('connectionBadge').className='pill '+(state.connected?'ok':'');$('sideStatus').textContent=state.connected?'Backend connected':'API unavailable';$('sideSub').textContent=state.connected?'Sensor feed available':'Sensor feed unavailable';$('footerMode').textContent=(state.connected?'API data':'No live data')+' • v1.0';document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===state.mode));let html='';if(state.page==='Dashboard'){html=state.mode==='AUTO'?autoPage():state.mode==='MAINTENANCE'?maintenancePage():sleepPage()}else if(state.page==='Sensor Logs'){html=logsPage()}else if(state.page==='Alert History'){html=alertsPage()}else if(state.page==='Device Status'){html=devicePage()}else if(state.page==='Sleep History'){html=sleepHistoryPage()}else if(state.page==='Cloud Sync'){html=syncPage()}else{html=settingsPage()}$('content').innerHTML=html;if(state.page==='Dashboard'&&state.mode==='AUTO')drawChart()}
function autoPage(){return syncSummaryPanel()+activeAlertsPanel()+`<section class="sensors">${sensors.map(s=>`<article class="card sensor ${state.metric===s.key?'selected':''}" data-metric="${s.key}"><div class="sensor-top"><div class="sensor-icon">${s.icon}</div>${badge(state.connected?'LIVE':'OFFLINE',state.connected?'ok':'')}</div><div class="sensor-name">${s.name}</div><div class="sensor-value">${fmt(state.reading[s.key],s.key==='gas'?0:1)} <span>${s.unit}</span></div></article>`).join('')}</section><div class="row2"><section class="card"><div class="chart-head"><div><h2 style="margin:0">Sensor Trends</h2><span class="muted tiny">${state.connected?'Recent API samples':'Illustrative demo readings'}</span></div>${badge('Updates every 3s')}</div><div class="tabs" style="margin-top:15px">${sensors.map(s=>`<button class="btn ${state.metric===s.key?'active':''}" data-metric="${s.key}">${s.name}</button>`).join('')}</div><div class="chart-wrap"><svg id="chart" viewBox="0 0 600 230" role="img" aria-label="Sensor trend chart"></svg></div><div class="chart-labels"><span>Earlier</span><span>Latest</span></div></section><section class="card"><h2>Device Status</h2><div class="devices">${deviceRows()}</div><div class="recommend"><strong>Safety Recommendations</strong><p class="tiny" style="margin-bottom:0">${state.connected?'Configure verified sensor thresholds before interpreting hazard levels.':'Connect HOMEGUARD to display real safety recommendations.'}</p></div></section></div><section class="card"><div class="table-head"><h2>Recent Sensor Logs</h2><button class="btn" data-page="Sensor Logs">View All</button></div>${logTable(state.logs.slice(-5).reverse())}<p class="tiny muted">Logging target: every ${state.logMinutes} minutes. ${state.connected?'Showing saved SQLite records from the backend.':'Demo values are not saved as actual test results.'}</p></section>`}
// Active conditions are inferred from sensor readings, NOT Arduino output acknowledgments.
// Thresholds must be kept aligned with the deployed Arduino sketch.
function activeAlertsPanel(){
  const r=state.reading;
  const valid=state.connected&&state.lastSensorAt&&Date.now()-state.lastSensorAt<12000;
  let items=[];
  if(valid){
    const gas=Number(r.gas),hum=Number(r.humidity),dist=Number(r.distance);
    if(gas>=300)state.alertLatch.gas=true;
    else if(gas<=250)state.alertLatch.gas=false;
    if(hum>=70)state.alertLatch.humidity=true;
    else if(hum<=65)state.alertLatch.humidity=false;
    if(state.alertLatch.gas)items.push(['⚠️','Elevated MQ-2 reading','Raw reading '+fmt(gas,0)+'; prototype threshold ≥300. This does not identify smoke or confirm a gas leak.','critical']);
    if(state.alertLatch.humidity)items.push(['💧','High humidity','Humidity '+fmt(hum)+'%; automatic ventilation threshold ≥70%.','']);
    if(Number.isFinite(dist)&&dist>0&&dist<15)items.push(['📏','Nearby object detected','Distance '+fmt(dist)+' cm; proximity threshold <15 cm.','']);
  }
  let body='';
  if(!valid)body='<div class="alert-item"><span class="alert-symbol">⌛</span><div><strong>Waiting for fresh sensor data</strong><p>Alerts cannot be determined from unavailable or stale readings.</p></div></div>';
  else if(!items.length)body='<div class="alert-item clear"><span class="alert-symbol">✓</span><div><strong>No active threshold warnings</strong><p>Current readings are below the configured prototype triggers. This is not a certified safety assessment.</p></div></div>';
  else body=items.map(([ico,title,detail,cls])=>`<div class="alert-item ${cls}" role="status"><span class="alert-symbol">${ico}</span><div><strong>${title}</strong><p>${detail}</p></div></div>`).join('');
  return `<section class="card active-alerts" aria-label="Active sensor alerts"><div class="table-head"><h2>Active Sensor Alerts</h2>${badge(items.length?items.length+' active':valid?'No active alerts':'Unavailable',items.length?'danger':valid?'ok':'warn')}</div><p class="alert-meta">${valid?'Last sensor update: '+safe(time(r.last_update)):'Waiting for fresh readings'} · ${state.mode} mode · Prototype thresholds</p><div class="alert-grid">${body}</div><p class="tiny muted" style="margin-bottom:0">These are software-inferred conditions, not confirmed physical output states. Alarm history is saved separately by the backend.</p></section>`;
}
function deviceRows(){return [['LED','led','💡'],['Fan','fan','🌀'],['Buzzer','buzzer','🔊']].map(([name,key,ico])=>`<div class="device"><span class="device-name"><span class="device-icon">${ico}</span><strong>${name}</strong></span>${state.outputsLoaded?badge('Requested '+(state.outputs[key]?'ON':'OFF'),state.outputs[key]?'warn':''):badge('Unknown')}</div>`).join('')}
function maintenancePage(){return `<div class="stack"><section class="card"><h2>Maintenance Control Panel</h2><div class="notice">Maintenance requests are stored in SQLite and polled by the local Arduino bridge. Physical output state is not independently acknowledged. Automatic database sensor logging is paused in this mode.</div><button class="btn" data-action="check">Check Current Sensors</button><p class="tiny muted">${safe(state.notice||'Request the latest reading received by the backend (not a new hardware measurement).')}</p></section><section class="card"><h2>Actuator Testing — Backend Requests</h2><p class="muted">${state.outputsLoaded?'Saved requested states from FastAPI.':'Loading requested states from FastAPI…'} ${state.hardwareConnected&&state.hardwareAcknowledged?'Hardware acknowledged.':'No direct Arduino acknowledgment is available; verify outputs physically.'}</p>${[['LED','led','💡'],['Fan','fan','🌀'],['Buzzer','buzzer','🔊']].map(([n,k,ico])=>`<div class="control-row"><strong>${ico} ${n}</strong><button class="btn ${state.outputs[k]?'active':''}" data-toggle="${k}" ${!state.connected||!state.outputsLoaded||state.outputBusy?'disabled':''}>Request ${state.outputs[k]?'OFF':'ON'} (currently ${state.outputs[k]?'ON':'OFF'})</button></div>`).join('')}</section></div>`}
function sleepPage(){return `<section class="card"><h2>Sleep & Power Management</h2><div class="notice">SLEEP mode requests all outputs OFF through the local bridge; it does not put the Arduino into hardware power-down sleep. Automatic database sensor logging is paused.</div><div class="status-hero"><div class="symbol">${state.demoSleep?'🌙':'☀️'}</div><h2>Demo ${state.demoSleep?'Sleeping':'Awake'}</h2><p class="muted">Actual hardware state: unverified</p></div><div class="two-buttons"><button class="btn primary" data-action="sleep" ${state.demoSleep?'disabled':''}>Demo Sleep</button><button class="btn" data-action="wake" ${!state.demoSleep?'disabled':''}>Demo Wake</button></div><h2 style="margin-top:24px">Recent Sleep Sessions</h2>${sleepHistoryTable()}<p><button class="btn" data-page="Sleep History">View Full Sleep History</button></p></section>`}
function logTable(logs){return `<div class="table-scroll"><table><thead><tr><th>Timestamp</th><th>Temperature</th><th>Humidity</th><th>Gas</th><th>Distance</th></tr></thead><tbody>${logs.length?logs.map(r=>`<tr><td>${safe(time(r.timestamp))}</td><td>${fmt(r.temperature)} °C</td><td>${fmt(r.humidity)} %</td><td>${fmt(r.gas,0)}</td><td>${fmt(r.distance)} cm</td></tr>`).join(''):'<tr><td colspan="5" class="empty">'+(state.logsLoaded?'No saved sensor records yet':'Unable to load saved records')+'</td></tr>'}</tbody></table></div>`}
function logsPage(){return card('Sensor Data Logs',`<p class="muted">Saved readings retrieved from the HOMEGUARD SQLite database through the FastAPI logs endpoint. The backend controls logging frequency.</p>${logTable(state.logs.slice().reverse())}<button class="btn" data-action="csv">Export Saved Logs CSV</button>`)}
function alertsPage(){return card('Alert History — SQLite',`<p class="muted">Software-generated alerts from sensor readings received in AUTO mode. These do not confirm physical alarms.</p><div class="table-head"><span class="tiny muted">${state.alerts.length} alert(s) loaded</span><button class="btn" data-action="refreshAlerts">Refresh</button></div><div class="table-scroll"><table><thead><tr><th>Timestamp</th><th>Alert Type</th><th>Message</th><th>Sync Status</th></tr></thead><tbody>${state.alerts.length?state.alerts.map(r=>`<tr><td>${safe(time(r.timestamp))}</td><td>${badge(r.alert_type||'Unknown','danger')}</td><td>${safe(r.message)}</td><td>${badge(r.sync_status||'unknown',r.sync_status==='pending'?'warn':'ok')}</td></tr>`).join(''):`<tr><td colspan="4" class="empty">${state.alertsError?'Unable to load alert history from FastAPI.':state.alertsLoaded?'No alerts recorded yet.':'Loading alert history…'}</td></tr>`}</tbody></table></div><p class="tiny muted">Pending indicates that online synchronization has not yet completed. Timestamps use your browser's local time.</p>`) }
function deviceHistoryTable(){return `<div class="table-scroll"><table><thead><tr><th>Timestamp</th><th>Mode</th><th>LED</th><th>Fan</th><th>Buzzer</th><th>Sync Status</th></tr></thead><tbody>${state.deviceLogs.length?state.deviceLogs.map(r=>`<tr><td>${safe(time(r.timestamp))}</td><td>${badge(r.mode||'Unknown')}</td>${['led','fan','buzzer'].map(k=>`<td>${badge(Number(r[k])===1?'Requested ON':'Requested OFF',Number(r[k])===1?'warn':'')}</td>`).join('')}<td>${badge(r.sync_status||'unknown',r.sync_status==='pending'?'warn':'ok')}</td></tr>`).join(''):`<tr><td colspan="6" class="empty">${state.deviceLogsError?'Unable to load device history from FastAPI.':state.deviceLogsLoaded?'No device status changes recorded yet.':'Loading device history…'}</td></tr>`}</tbody></table></div>`}
function devicePage(){return `<div class="stack">${card('Controller & Output Devices',`<p class="muted">Backend connection: ${state.connected?'FastAPI reachable':'Unavailable'}</p><div class="devices">${deviceRows()}</div><p class="tiny muted">These are saved requested states, not confirmed physical device states.</p>`)}${card('Device Status History — SQLite',`<p class="muted">Recorded backend output requests and mode transitions. Timestamps use your browser's local time.</p><div class="table-head"><span class="tiny muted">${state.deviceLogs.length} record(s) loaded</span><button class="btn" data-action="refreshDevices">Refresh</button></div>${deviceHistoryTable()}<p class="tiny muted">Pending means the record has not been synced to an online database. No Arduino acknowledgment is implied.</p>`)}</div>`}
function sleepHistoryTable(){return `<div class="table-scroll"><table><thead><tr><th>Session</th><th>Sleep Start</th><th>Wake Time</th><th>Duration</th><th>Sync Status</th></tr></thead><tbody>${state.sleepLogs.length?state.sleepLogs.map(r=>`<tr><td>#${safe(r.id)}</td><td>${safe(time(r.sleep_start))}</td><td>${r.wake_time?safe(time(r.wake_time)):'In progress'}</td><td>${r.duration_seconds==null?'—':safe(Number(r.duration_seconds).toFixed(2))+' seconds'}</td><td>${badge(r.sync_status||'unknown',r.sync_status==='pending'?'warn':'ok')}</td></tr>`).join(''):`<tr><td colspan="5" class="empty">${state.sleepLogsError?'Could not load sleep history from FastAPI.':state.sleepLogsLoaded?'No sleep sessions recorded yet.':'Loading sleep history…'}</td></tr>`}</tbody></table></div>`}
function sleepHistoryPage(){return card('Sleep History — SQLite',`<p class="muted">Backend-requested SLEEP sessions, not measured Arduino power-down. Timestamps are displayed in your browser's local time.</p><div class="table-head"><span class="tiny muted">${state.sleepLogs.length} session(s) loaded</span><button class="btn" data-action="refreshSleep">Refresh</button></div>${sleepHistoryTable()}<p class="tiny muted">Pending means the record has not been synced to an online database.</p>`)}
function settingsPage(){const a=state.alertSettings;const fields=[['temperature_max','🌡️ Temperature maximum (°C)'],['humidity_max','💧 Humidity maximum (%)'],['gas_max','〰️ Gas maximum (raw)'],['distance_min','📏 Distance minimum (cm)'],['cooldown_seconds','⏱️ Alert cooldown (seconds)']];return `<div class="stack">${card('Adjustable Alert Thresholds — Testing',`<div class="notice">These thresholds are for prototype testing only, not certified safety limits. Alerts are generated from received AUTO-mode readings, not verified physical hazards.</div>${a?`<form id="alertSettingsForm">${fields.map(([k,label])=>`<div class="field"><label for="alert_${k}">${label}</label><input id="alert_${k}" name="${k}" type="number" step="${k==='cooldown_seconds'?'1':'any'}" ${k==='cooldown_seconds'?'min="0"':'min="0"'} required value="${safe(a[k])}"></div>`).join('')}<button class="btn primary" type="submit" ${state.alertSettingsBusy?'disabled':''}>${state.alertSettingsBusy?'Saving…':'Save Alert Thresholds'}</button> <button class="btn" type="button" data-action="refreshAlertSettings">Reload</button></form>`:`<p class="muted">${state.alertSettingsError?safe(state.alertSettingsError):'Loading alert settings…'}</p><button class="btn" data-action="refreshAlertSettings">Retry</button>`}<p class="tiny muted" role="status">${safe(state.alertSettingsNotice)}</p>`)}${card('Dashboard Settings',`<div class="field"><label for="logInterval">Target database log interval (minutes)</label><input id="logInterval" type="number" min="3" max="5" step="1" value="${state.logMinutes}"></div><button class="btn primary" data-action="saveSettings">Save Preview Settings</button><p class="muted tiny">This log interval control is a browser-session preview; it does not change the backend's 3-minute logging interval.</p><div class="notice">Backend API: <code>${safe(API_BASE)}/api/sensors</code><br>Cloud synchronization runs through a separate local Python process. View Cloud Sync for SQLite upload counts.</div>`)}</div>`}

function healthBadge(){
  const h=state.syncHealth;
  if(!h)return badge('Not started','warn');
  const labels={healthy:'Healthy',syncing:'Syncing',error:'Connection / sync error',partial_error:'Partial errors',inactive:'Uploader inactive',stopped:'Stopped',not_started:'Not started'};
  return badge(labels[h.status]||'Unknown',h.status==='healthy'?'ok':h.status==='error'||h.status==='partial_error'?'danger':'warn');
}
function healthPanel(){
  const h=state.syncHealth;
  return card('Uploader Health',`<div class="table-head"><strong>${healthBadge()}</strong><span class="tiny muted">Local process heartbeat</span></div>
    <div class="device"><span>Uploader</span><strong>${h?.active?'Active':'Inactive / unverified'}</strong></div>
    <div class="device"><span>Last heartbeat</span><strong>${safe(time(h?.heartbeat_at))}</strong></div>
    <div class="device"><span>Last successful upload</span><strong>${safe(time(h?.last_success_at))}</strong></div>
    <div class="device"><span>Last cycle uploads / failures</span><strong>${h?Number(h.cycle_uploaded||0)+' / '+Number(h.cycle_failed||0):'—'}</strong></div>
    ${h?.last_error?`<p class="tiny muted">Last error: ${safe(h.last_error)}</p>`:''}
    <p class="tiny muted">Health is based on local uploader heartbeats and recent upload attempts, not an independent Supabase connectivity check.</p>`);
}
function syncTotals(){
  const counts=state.syncCounts||{};
  const names=['sensor_logs','alert_logs','device_status_logs','sleep_logs'];
  return names.reduce((acc,name)=>{
    const item=counts[name]||{};
    acc.pending+=Number(item.pending)||0;
    acc.synced+=Number(item.synced)||0;
    return acc;
  },{pending:0,synced:0});
}
function syncSummaryPanel(){
  const ready=!!state.syncCounts;
  const t=syncTotals();
  const total=t.pending+t.synced;
  const pct=total?100*t.synced/total:0;
  return `<section class="card" style="margin-bottom:20px"><div class="table-head"><h2>☁ Cloud Synchronization</h2><button class="btn" data-page="Cloud Sync">View Details</button></div><p class="tiny muted">Local SQLite synchronization records · ${state.syncError?'Latest status refresh failed':ready?'Updated '+safe(time(state.syncUpdatedAt)):'Waiting for backend status'}</p><div class="sensors" style="margin:12px 0"><div><div class="tiny muted">Synced records</div><div class="sensor-value">${ready?t.synced:'—'}</div></div><div><div class="tiny muted">Pending records</div><div class="sensor-value">${ready?t.pending:'—'}</div></div><div><div class="tiny muted">Completion</div><div class="sensor-value">${ready?pct.toFixed(1)+'%':'—'}</div></div><div><div class="tiny muted">Uploader status</div>${healthBadge()}</div></div><div style="height:9px;background:#e6ebf2;border-radius:999px;overflow:hidden"><div style="height:100%;width:${pct.toFixed(2)}%;background:#059669"></div></div><p class="tiny muted" style="margin-bottom:0">Counts update from SQLite. Uploader status is inferred from its SQLite heartbeat and recent upload results.</p></section>`;
}
function syncPage(){
  const names=[['sensor_logs','Sensor Logs'],['alert_logs','Alert Logs'],['device_status_logs','Device Status Logs'],['sleep_logs','Sleep Logs']];
  const t=syncTotals();
  const ready=!!state.syncCounts;
  return `<div class="stack">${syncSummaryPanel()}${healthPanel()}${card('Synchronization Breakdown',`<div class="table-head"><span class="tiny muted">${ready?'Total: '+(t.pending+t.synced)+' records':'No status data loaded yet'}</span><button class="btn" data-action="refreshSync">Refresh Now</button></div><div class="table-scroll"><table><thead><tr><th>Table</th><th>Synced</th><th>Pending</th></tr></thead><tbody>${names.map(([key,label])=>`<tr><td>${label}</td><td>${ready?Number(state.syncCounts[key]?.synced||0):'—'}</td><td>${ready?Number(state.syncCounts[key]?.pending||0):'—'}</td></tr>`).join('')}</tbody></table></div><p class="tiny muted">The separate homeguard_auto_sync.py process handles uploads and retries. The dashboard only reads local synchronization results; uploader health is inferred from its heartbeat and upload results, not from an independent cloud check.</p>`)}</div>`;
}
async function fetchSyncStatus(){
  try{
    const r=await fetch(API_BASE+'/api/sync/status',{cache:'no-store',signal:AbortSignal.timeout(4000)});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const data=await r.json();
    if(!data.counts||typeof data.counts!=='object')throw new Error('Invalid sync status');
    state.syncCounts=data.counts;
    state.syncHealth=data.health||null;
    state.syncError=false;
    state.syncUpdatedAt=new Date().toISOString();
  }catch(err){state.syncError=true;}
  if(state.page==='Cloud Sync'||(state.page==='Dashboard'&&state.mode==='AUTO'))render();
}
function drawChart(){const svg=$('chart');if(!svg)return;let hist=state.history.length?state.history.map(r=>Number(r[state.metric])).filter(Number.isFinite):({temperature:[29.5,30,29.8,31,30.5,31.8,31.4,32.5],humidity:[64,65,65,67,66,68,69,70.2],gas:[100,115,110,130,125,140,135,150],distance:[28,27,27.5,26,26.8,25,26,25.5]})[state.metric];hist=hist.slice(-30);if(hist.length===1)hist=[hist[0],hist[0]];const low=Math.min(...hist),high=Math.max(...hist),pad=Math.max((high-low)*.2,1),min=low-pad,max=high+pad;const xy=hist.map((n,i)=>[35+(i/(hist.length-1))*535,185-((n-min)/(max-min))*150]);const color=sensors.find(s=>s.key===state.metric).color;svg.innerHTML=[40,85,130,175].map(y=>`<line x1="30" x2="580" y1="${y}" y2="${y}" stroke="#e7edf5" stroke-dasharray="4 5"/>`).join('')+`<polyline points="${xy.map(p=>p.join(',')).join(' ')}" fill="none" stroke="${color}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>`+xy.map(([x,y])=>`<circle cx="${x}" cy="${y}" r="3.5" fill="white" stroke="${color}" stroke-width="2"/>`).join('')}
async function changeMode(mode){
  if(!state.connected){alert('Connect to FastAPI first to save the operating mode.');return;}
  try{
    const r=await fetch(API_BASE+'/api/mode',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode})});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const result=await r.json();
    state.mode=result.mode;state.page='Dashboard';render();fetchOutputs();fetchSleepHistory();
    if(mode==='SLEEP')alert('SLEEP requested. The local bridge should turn outputs OFF; Arduino is not in hardware power-down sleep.');
  }catch(err){alert('Mode change failed: '+err.message)}
}
async function fetchMode(){
  try{const r=await fetch(API_BASE+'/api/mode',{cache:'no-store'});if(!r.ok)return;
    const result=await r.json();if(result.mode&&state.mode!==result.mode){state.mode=result.mode;render();fetchSleepHistory()}
  }catch(err){}
}
async function fetchOutputs(){
  try{
    const r=await fetch(API_BASE+'/api/maintenance/outputs',{cache:'no-store',signal:AbortSignal.timeout(4000)});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const d=await r.json();
    if(!d.requested_outputs)throw new Error('Missing requested_outputs');
    for(const k of ['led','fan','buzzer'])state.outputs[k]=Boolean(d.requested_outputs[k]);
    state.outputsLoaded=true;
    state.hardwareConnected=Boolean(d.hardware_connected);
    state.hardwareAcknowledged=Boolean(d.hardware_acknowledged);
  }catch(e){state.outputsLoaded=false;}
  render();
}
async function setOutput(device){
  if(state.mode!=='MAINTENANCE'){alert('Switch to MAINTENANCE mode first.');return;}
  if(!state.connected||!state.outputsLoaded||state.outputBusy)return;
  state.outputBusy=true;render();
  try{
    const r=await fetch(API_BASE+'/api/maintenance/outputs/'+encodeURIComponent(device),{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({enabled:!state.outputs[device]})
    });
    const d=await r.json();
    if(!r.ok)throw new Error(d.detail?JSON.stringify(d.detail):'HTTP '+r.status);
    if(!d.requested_outputs)throw new Error('Missing requested_outputs');
    for(const k of ['led','fan','buzzer'])state.outputs[k]=Boolean(d.requested_outputs[k]);
    state.outputsLoaded=true;
    state.notice='Requested '+device.toUpperCase()+' '+(state.outputs[device]?'ON':'OFF')+' saved. The bridge will poll the request; verify the physical output.';
  }catch(e){alert('Unable to save output request: '+e.message);}
  finally{state.outputBusy=false;render();}
}
async function checkSensors(){
  try{
    const r=await fetch(API_BASE+'/api/maintenance/check',{cache:'no-store'});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const d=await r.json();
    const reading=d.reading||d.sensors||d.data||d;
    state.notice='Latest backend reading: '+sensors.map(s=>s.name+' '+fmt(reading[s.key])).join(' • ')+'. Not a new hardware measurement.';
  }catch(e){state.notice='Sensor check failed: '+e.message;}
  render();
}
async function fetchSensors(){try{const resp=await fetch(API_BASE+'/api/sensors',{cache:'no-store',signal:AbortSignal.timeout(2500)});if(!resp.ok)throw Error('API '+resp.status);let data=await resp.json();if(data.homeguard)data=data.homeguard;if(!sensors.every(s=>Number.isFinite(Number(data[s.key]))))throw Error('Invalid sensor response');state.reading={...state.reading,...data};state.connected=true;state.lastSensorAt=data.last_update?Date.parse(data.last_update):null;const timestamp=new Date().toISOString();state.history.push({...state.reading,timestamp});if(state.history.length>100)state.history.shift();}catch(e){state.connected=false;state.lastSensorAt=null;state.reading={temperature:null,humidity:null,gas:null,distance:null,last_update:null};state.history=[]}render()}
async function fetchLogs(){for(const path of ['/api/logs','/api/sensor-logs']){try{const resp=await fetch(API_BASE+path,{cache:'no-store',signal:AbortSignal.timeout(2500)});if(!resp.ok)continue;const payload=await resp.json();const rows=Array.isArray(payload)?payload:Array.isArray(payload.logs)?payload.logs:Array.isArray(payload.sensor_logs)?payload.sensor_logs:null;if(!rows)continue;state.logs=rows.filter(r=>r&&r.timestamp).sort((a,b)=>new Date(a.timestamp)-new Date(b.timestamp));state.logsLoaded=true;render();return}catch(e){}}state.logsLoaded=false;render()}
async function fetchAlerts(){try{const r=await fetch(API_BASE+'/api/alerts',{cache:'no-store',signal:AbortSignal.timeout(4000)});if(!r.ok)throw Error('HTTP '+r.status);const d=await r.json();if(!Array.isArray(d.logs))throw Error('Missing logs');state.alerts=d.logs;state.alertsLoaded=true;state.alertsError=false;}catch(e){state.alertsError=true;}if(state.page==='Alert History')render()}
async function fetchAlertSettings(){try{const r=await fetch(API_BASE+'/api/alert-settings',{cache:'no-store',signal:AbortSignal.timeout(4000)});if(!r.ok)throw Error('HTTP '+r.status);const d=await r.json();if(!d.settings)throw Error('Missing settings');state.alertSettings=d.settings;state.alertSettingsError='';}catch(e){state.alertSettingsError='Could not load settings: '+e.message;}if(state.page==='Settings')render()}
async function saveAlertSettings(form){if(state.alertSettingsBusy)return;const keys=['temperature_max','humidity_max','gas_max','distance_min','cooldown_seconds'];const settings={};for(const key of keys){const input=form.elements.namedItem(key);if(!input||input.value.trim()===''){alert('Enter a value for '+key);return;}settings[key]=Number(input.value);if(!Number.isFinite(settings[key])||settings[key]<0||(key==='cooldown_seconds'&&!Number.isInteger(settings[key]))){alert('Invalid value for '+key);return;}}if(settings.humidity_max>100){alert('Humidity cannot exceed 100%.');return;}state.alertSettingsBusy=true;state.alertSettingsNotice='Saving…';render();try{const r=await fetch(API_BASE+'/api/alert-settings',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(settings)});const d=await r.json();if(!r.ok)throw Error(d.detail?JSON.stringify(d.detail):'HTTP '+r.status);state.alertSettingsNotice='Settings saved successfully to backend.';await fetchAlertSettings();}catch(e){state.alertSettingsNotice='Save failed: '+e.message;alert(state.alertSettingsNotice);}finally{state.alertSettingsBusy=false;render()}}
async function fetchDeviceHistory(){try{const r=await fetch(API_BASE+'/api/device-history',{cache:'no-store',signal:AbortSignal.timeout(4000)});if(!r.ok)throw new Error('HTTP '+r.status);const d=await r.json();if(!Array.isArray(d.logs))throw new Error('Missing logs');state.deviceLogs=d.logs;state.deviceLogsLoaded=true;state.deviceLogsError=false;}catch(e){state.deviceLogsError=true;}if(state.page==='Device Status')render()}
async function fetchSleepHistory(){try{const r=await fetch(API_BASE+'/api/sleep-history',{cache:'no-store',signal:AbortSignal.timeout(4000)});if(!r.ok)throw new Error('HTTP '+r.status);const d=await r.json();if(!Array.isArray(d.logs))throw new Error('Missing logs');state.sleepLogs=d.logs;state.sleepLogsLoaded=true;state.sleepLogsError=false;}catch(e){state.sleepLogsError=true;}if(state.page==='Sleep History'||(state.page==='Dashboard'&&state.mode==='SLEEP'))render()}
function exportCSV(){const head=['timestamp','temperature','humidity','gas','distance'];const rows=[head.join(','),...state.logs.map(r=>head.map(k=>JSON.stringify(r[k]??'')).join(','))];const blob=new Blob([rows.join('\r\n')],{type:'text/csv'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='homeguard_sqlite_sensor_logs.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
document.addEventListener('click',e=>{const mode=e.target.closest('[data-mode]');if(mode){changeMode(mode.dataset.mode);return}const page=e.target.closest('[data-page]');if(page){state.page=page.dataset.page;render();if(state.page==='Sleep History')fetchSleepHistory();if(state.page==='Device Status')fetchDeviceHistory();if(state.page==='Alert History')fetchAlerts();if(state.page==='Settings')fetchAlertSettings();if(state.page==='Cloud Sync')fetchSyncStatus();return}const metric=e.target.closest('[data-metric]');if(metric){state.metric=metric.dataset.metric;render();return}const toggle=e.target.closest('[data-toggle]');if(toggle){setOutput(toggle.dataset.toggle);return}const action=e.target.closest('[data-action]');if(!action)return;switch(action.dataset.action){case 'sleep':state.demoSleep=true;break;case 'wake':state.demoSleep=false;break;case 'check':checkSensors();return;case 'csv':exportCSV();break;case 'refreshSleep':fetchSleepHistory();return;case 'refreshDevices':fetchDeviceHistory();return;case 'refreshAlerts':fetchAlerts();return;case 'refreshSync':fetchSyncStatus();return;case 'refreshAlertSettings':fetchAlertSettings();return;case 'saveSettings':{const n=Number($('logInterval').value);if(!Number.isInteger(n)||n<3||n>5){alert('Choose a whole number from 3 to 5 minutes.');return}state.logMinutes=n;break}}render()});
document.addEventListener('submit',e=>{if(e.target.id==='alertSettingsForm'){e.preventDefault();saveAlertSettings(e.target)}});
render();fetchSyncStatus();fetchSensors();fetchLogs();fetchMode();fetchOutputs();fetchSleepHistory();fetchDeviceHistory();fetchAlerts();fetchAlertSettings();setInterval(fetchSensors,3000);setInterval(fetchLogs,15000);setInterval(fetchMode,5000);setInterval(fetchOutputs,10000);setInterval(fetchSleepHistory,15000);setInterval(fetchDeviceHistory,15000);setInterval(fetchAlerts,15000);setInterval(fetchSyncStatus,10000);
</script>
</body></html>
